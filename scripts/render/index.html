<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const S = +new URLSearchParams(location.search).get('s') || 512;
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
renderer.setSize(S,S); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const draco = new DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
const loader = new GLTFLoader().setDRACOLoader(draco);

window.renderFrames = async (id, N = 48, armsDown = 0) => {
  const gltf = await loader.loadAsync(`/models/${id}.glb`);
  const scene = new THREE.Scene(); scene.environment = envTex; scene.environmentIntensity = 0.9;
  const root = gltf.scene; const pivot = new THREE.Group(); pivot.add(root); scene.add(pivot);
  root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });

  // T-pose -> brazos relajados: gira los huesos LArm/RArm en el eje Z del mundo
  let armsPosed = 0;
  if (armsDown > 0) {
    root.updateMatrixWorld(true);
    const arms = []; root.traverse(o => { if (o.isBone && /(^|\s)[LR]Arm$/.test(o.name)) arms.push(o); });
    const xs = arms.map(b => new THREE.Vector3().setFromMatrixPosition(b.matrixWorld).x);
    const mid = xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : 0;
    arms.forEach((b, k) => {
      const sgn = Math.sign(xs[k] - mid) || 1;
      const W = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), -sgn * THREE.MathUtils.degToRad(armsDown));
      const Pq = b.parent.getWorldQuaternion(new THREE.Quaternion());
      b.quaternion.premultiply(Pq.clone().invert().multiply(W).multiply(Pq)); armsPosed++;
    });
    root.updateMatrixWorld(true);
  }
  const hasClip = gltf.animations.length > 0;
  let mixer = null, dur = 1, pingpong = false, clipName = null;
  if (hasClip) { // clip mas largo = animacion principal
    const pick = [/wait\d*_loop/i, /aidle|idle/i, /loop/i];
    let clip = null;
    for (const re of pick) { clip = gltf.animations.find(a => re.test(a.name) && !/turn|sleep|rest|eat|stun|down/i.test(a.name)); if (clip) break; }
    clip = clip || [...gltf.animations].sort((a,b)=>b.duration-a.duration)[0];
    pingpong = !/loop|wait/i.test(clip.name);
    mixer = new THREE.AnimationMixer(root); mixer.clipAction(clip).play(); dur = Math.max(clip.duration, 0.1);
    clipName = clip.name;
    mixer.setTime(0);
  }
  // encuadre: caja precisa (con esqueleto aplicado) unida sobre varios instantes del bucle
  const box = new THREE.Box3();
  for (let j=0;j<8;j++) {
    if (mixer) mixer.setTime(j/8*dur);
    root.updateMatrixWorld(true);
    root.traverse(o => { if (o.isSkinnedMesh) o.skeleton.update(); });
    box.union(new THREE.Box3().setFromObject(root, true));
  }
  if (mixer) mixer.setTime(0);
  const size = box.getSize(new THREE.Vector3()); const c = box.getCenter(new THREE.Vector3());
  root.position.sub(c); const R = Math.max(size.x,size.y,size.z)/2 || 1;
  const cam = new THREE.PerspectiveCamera(30, 1, R*0.02, R*60);
  const dist = (R*1.25) / Math.sin(THREE.MathUtils.degToRad(15));
  cam.position.set(0, R*0.25, dist); cam.lookAt(0,0,0);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.55));
  const key = new THREE.DirectionalLight(0xfff2e0, 2.4); key.position.set(R*2, R*3, R*3); key.castShadow = false;
  key.shadow.mapSize.set(1024,1024); const sc = key.shadow.camera; sc.left=sc.bottom=-R*2; sc.right=sc.top=R*2; sc.near=0.1; sc.far=R*12; key.shadow.bias=-0.0005; scene.add(key);
  const rim = new THREE.DirectionalLight(0x9ec8ff, 1.6); rim.position.set(-R*3, R*1.5, -R*2.5); scene.add(rim);
  const cv = document.createElement('canvas'); cv.width = cv.height = 128; const g = cv.getContext('2d');
  const gr = g.createRadialGradient(64,64,0,64,64,64); gr.addColorStop(0,'rgba(0,0,0,0.55)'); gr.addColorStop(0.55,'rgba(0,0,0,0.22)'); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0,0,128,128);
  const blob = new THREE.Mesh(new THREE.PlaneGeometry(1,1), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv), transparent:true, depthWrite:false}));
  blob.rotation.x = -Math.PI/2; blob.position.y = -size.y/2; scene.add(blob);
  const wid = Math.max(size.x, size.z);

  // suelo = punto mas bajo en todo el bucle; elevacion por frame = altura del punto mas bajo del frame sobre el suelo
  const lows = [];
  for (let i=0;i<N;i++) {
    const p=i/N; if (mixer) mixer.setTime((pingpong ? (1-Math.abs(2*p-1)) : p)*dur*(pingpong?0.999:1));
    root.updateMatrixWorld(true); root.traverse(o=>{ if(o.isSkinnedMesh) o.skeleton.update(); });
    lows.push(new THREE.Box3().setFromObject(root,true).min.y + root.position.y*0);
  }
  const floorY = Math.min(...lows) - 0.01*R;
  const lift = i => lows[i] - Math.min(...lows);
  const frames = [];
  for (let i=0;i<N;i++) {
    const p = i/N, w = 2*Math.PI*p;
    if (mixer) mixer.setTime((pingpong ? (1-Math.abs(2*p-1)) : p) * dur * (pingpong ? 0.999 : 1));
    // vida procedural en bucle perfecto (tambien sobre el clip, mas suave)
    const k = hasClip ? 0.5 : 1;
    pivot.rotation.y = 0.5*k*Math.sin(w);
    pivot.position.y = 0.018*R*k*Math.sin(2*w);
    pivot.scale.setScalar(1 + 0.012*k*Math.sin(2*w+1.2));
    blob.position.y = floorY; blob.scale.setScalar(wid*1.15*(1 - Math.min(0.45, Math.max(0,(pivot.position.y + lift(i))/ (R*2)))));
    blob.material.opacity = 1 - Math.min(0.6, Math.max(0,lift(i))/(R*1.5));
    renderer.render(scene, cam);
    frames.push(renderer.domElement.toDataURL('image/png'));
  }
  scene.traverse(o=>{ if(o.geometry) o.geometry.dispose(); });
  return { frames, hasClip, clips: gltf.animations.length, clipName, pingpong, armsPosed };
};
window.ready = true;
</script>
