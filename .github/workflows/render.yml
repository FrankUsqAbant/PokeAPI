name: Render 3D a WebP animado

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Numeros separados por coma, o 'all' para los 151"
        default: "all"
  push:
    branches: ["render-3d"]
    paths: ["scripts/render/**", ".github/workflows/render.yml"]

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - id: p
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.ids }}" = "all" ]; then
            echo 'shards=[0,1,2,3,4,5,6,7]' >> $GITHUB_OUTPUT
          else
            echo 'shards=[0]' >> $GITHUB_OUTPUT
          fi

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Instalar Playwright y ffmpeg
        run: |
          cd scripts/render
          npm init -y >/dev/null
          npm i playwright@1.49.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          sudo apt-get install -y -qq ffmpeg
      - name: Renderizar
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.ids }}" = "all" ]; then
            export IDS=$(seq 1 151 | awk -v s=${{ matrix.shard }} '(($1-1)%8)==s' | paste -sd,)
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            export IDS="${{ github.event.inputs.ids }}"
          else
            export IDS="25,7,1,149"
          fi
          echo "IDS=$IDS"
          node scripts/render/render.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: render-${{ matrix.shard }}
          path: out/
