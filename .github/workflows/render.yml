name: Render 3D a WebP animado

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Numeros de Pokedex separados por coma"
        default: "25,7,1"
  push:
    branches: ["render-3d"]
    paths: ["scripts/render/**", ".github/workflows/render.yml"]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Instalar Playwright
        run: |
          cd scripts/render
          npm init -y >/dev/null
          npm i playwright@1.49.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Renderizar
        env:
          IDS: ${{ github.event.inputs.ids || '25,7,1' }}
          NODE_PATH: scripts/render/node_modules
        run: node scripts/render/render.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: render
          path: out/
